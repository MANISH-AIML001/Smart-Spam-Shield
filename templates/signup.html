<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Smart Spam Shield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-scene">

<div class="auth-page">
  <div class="auth-card">
    <div class="brand brand--center">
      <span class="brand__mark"></span>
      Smart Spam Shield
    </div>

    <h1 class="gradient-text auth-heading">Create your account</h1>
    <p class="auth-sub">Takes a few seconds — no email needed.</p>

    {% if error %}
      <div class="auth-note auth-note--spam">{{ error }}</div>
    {% endif %}

    <form method="POST" class="auth-form">
      <label>
        <span>Username</span>
        <input type="text" name="username" autocomplete="username" required autofocus>
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" autocomplete="new-password" required>
      </label>
      <label>
        <span>Confirm password</span>
        <input type="password" name="confirm" autocomplete="new-password" required>
      </label>
      <button type="submit">Create account</button>
    </form>

    <p class="auth-switch">
      Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
    </p>
  </div>
</div>

</body>
</html>
